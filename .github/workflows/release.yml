name: release

# Push в main или ручной запуск:
# main меняется только вручную влитым из dev pull request, поэтому релиз —
# только когда владелец решает его выпустить; обычные PR живут в dev (ci.yml).
# версия → тесты → нативные (NativeAOT) сборки rasm и rasim → GitHub Release с тегом v<version>.
# Описание релиза job release собирает из git log: коммиты со времени предыдущего релиза.
# Major и Minor задаются вручную в version.props, Patch = число коммитов в HEAD минус PatchBase (job version).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.ver.outputs.major }}
      minor: ${{ steps.ver.outputs.minor }}
      patch: ${{ steps.ver.outputs.patch }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        shell: bash
        run: |
          prop() { sed -n "s/.*<$1>\([0-9]\{1,\}\)<.*/\1/p" version.props | head -1; }
          major="$(prop MajorVersion)"
          minor="$(prop MinorVersion)"
          base="$(prop PatchBase)"; base="${base:-0}"
          test -n "$major" || { echo "MajorVersion not found in version.props" >&2; exit 1; }
          test -n "$minor" || { echo "MinorVersion not found in version.props" >&2; exit 1; }
          count="$(git rev-list --count HEAD)"
          patch=$((count - base)); [ "$patch" -lt 0 ] && patch=0
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "==> rasm rasim $major.$minor.$patch  (major/minor: version.props, patch: $patch = $count - $base)"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RiscASDK.slnx -c Release --nologo

  build:
    name: build ${{ matrix.rid }}
    needs: [ version, test ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04
            cross: aarch64
          - rid: osx-arm64
            os: macos-latest
    env:
      PATCH: ${{ needs.version.outputs.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Кросс-тулчейн для linux-arm64 (NativeAOT не умеет собирать с Windows на Linux).
      - name: Install cross toolchain
        if: matrix.cross != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zlib1g-dev \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ./build.sh ${{ matrix.rid }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Rid ${{ matrix.rid }} -Patch ${{ needs.version.outputs.patch }}

      - uses: actions/upload-artifact@v4
        with:
          # build.ps1/build.sh складывают в artifacts/ архивы rasm-*.zip и rasim-*.zip
          name: dist-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [ version, build ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # без checkout gh сам не определяет репозиторий по git remote
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
      PATCH: ${{ needs.version.outputs.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # полная история и все теги нужны, чтобы собрать список изменений для описания релиза
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Описание релиза — что реально изменилось с предыдущего релиза, а не вечный текст про версионирование.
      - name: Release notes
        shell: bash
        run: |
          # gh отдаёт релизы от новых к старым. предыдущий релиз — самый свежий из тех, чей
          # коммит является предком публикуемого; тот же самый тег пропускаем (перезапуск).
          prev=""
          base=""
          while IFS=$'\t' read -r tag sha; do
            if [ "$tag" = "$TAG" ]; then continue; fi
            if git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" HEAD; then
              prev="$tag"
              base="$sha"
              break
            fi
          done < <(gh api "repos/$GH_REPO/releases?per_page=30" --jq '.[] | [.tag_name, .target_commitish] | @tsv')
          if [ -n "$base" ]; then
            range="$base..HEAD"
          else
            range=""
          fi
          if [ -n "$range" ]; then
            log="$(git log --no-merges --pretty=format:'- %s (%h)' "$range")"
          else
            log="$(git log --no-merges --max-count=20 --pretty=format:'- %s (%h)' HEAD)"
          fi
          {
            echo "Нативные (NativeAOT) сборки rasm и rasim $VERSION: win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64."
            echo "Контрольные суммы архивов — в SHA256SUMS.txt."
            echo
            if [ -z "$range" ]; then
              echo "Первый релиз, отсчитывать изменения не от чего. Последние коммиты:"
              echo
              printf '%s\n' "$log"
            elif [ -z "$log" ]; then
              echo "Новых коммитов с $prev нет: это пересборка того же коммита, обновлены только архивы и описание."
            else
              echo "Изменения с $prev:"
              echo
              printf '%s\n' "$log"
              echo
              echo
              echo "Полный список: https://github.com/$GH_REPO/compare/$prev...$TAG"
            fi
            echo
            echo
            echo "Версия: Major и Minor задаются вручную в version.props, Patch ($PATCH) = число коммитов в HEAD минус PatchBase."
          } > notes.md
          cat notes.md

      # Повторный запуск на том же коммите даёт ту же версию: если релиз уже есть,
      # просто перезатираем ассеты и описание.
      - name: Publish release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "rasm + rasim $VERSION" \
              --notes-file notes.md
          fi
